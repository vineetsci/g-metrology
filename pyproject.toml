[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g-metrology"
version = "1.0.0"
readme = "README.md"
description = "Reproducible computational package for a metrological study of covariance adequacy and prospective validation in G measurements"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pyyaml", "numba", "matplotlib"]
license = {file = "LICENSE"}
authors = [
  {name = "Vineet Kumar", email = "337000970+vineetsci@users.noreply.github.com"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
bayesian = ["pymc>=6,<7", "arviz>=1,<2", "pytensor>=3,<4", "xarray", "h5netcdf", "h5py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/vineetsci/g-metrology"