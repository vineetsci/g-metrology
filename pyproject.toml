[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g-metrology"
version = "1.0.0"
readme = "README.md"
description = "Reproducible computational package for a metrological study of covariance adequacy and prospective validation in G measurements"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pyyaml", "numba", "matplotlib"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
bayesian = ["pymc>=6,<7", "arviz>=1,<2", "pytensor>=3,<4", "xarray", "h5netcdf", "h5py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
