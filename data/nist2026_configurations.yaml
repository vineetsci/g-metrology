# Table 19: Bayesian consensus and configuration-specific effects/dark uncertainties.
table19_bayesian_consensus:
  reference_tau_G_SI: 9.6e-15
  configurations:
    copper_servo: {tau_SI: 7.24e-15, lambda_SI: -2.03e-15}
    copper_free: {tau_SI: 5.08e-15, lambda_SI: 0.976e-15}
    sapphire_servo: {tau_SI: 2.20e-14, lambda_SI: -1.20e-14}
    sapphire_free: {tau_SI: 1.02e-14, lambda_SI: -1.57e-15}
  final_consensus: {G_SI: 6.67387e-11, u_SI: 3.8e-15, relative_u: 5.7e-5}
  note: "Table 19 reports posterior medians for dark uncertainties and configuration effects; the final consensus is the published Bayesian result."

# Thermal statement from Section 8.5 / mechanism discussion.
thermal_statement:
  relative_scale: 1.0e-4
  reference_signal_nNm: 13.9799
  torque_scale_pNm: 1.39799
  wording: "The paper reports a gas-mediated thermal torque scale of about 10^-4 (0.01%) of the lowest gravitational signal; no significant time-dependent torque was observed after servo-voltage application."

notes: >
  These four rows are internal configurations of one NIST/BIPM replication.
  They are not four independent world measurements and must not be naively
  appended to the CODATA world dataset.
