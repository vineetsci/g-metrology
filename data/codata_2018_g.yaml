# data/codata_2018_g.yaml
# CODATA-2018 G dataset (SI units) with published standard uncertainties and correlations (without CODATA-2018 expansion factor k=3.9).

dataset: CODATA-2018 G
unit_SI: m^3 kg^-1 s^-2
# CODATA-2018 reported an expansion factor k=3.9; the source value is retained here as metadata.
# Active reproducibility analyses use the stored k=1 standard uncertainties and estimate any
# additional scale through the specified model.
expansion_factor_k: 3.9   # u'_i = k * u_i applied to both diagonal and correlated off-diagonals
notes: >
  Order matches CODATA-2018 chronology and listing.
  Covariance Sigma uses Sigma_ii = (k*u_i)^2 and Sigma_ij = r_ij * (k*u_i)*(k*u_j) for listed (i,j,r_ij).

